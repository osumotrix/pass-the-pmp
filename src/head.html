<title>Pass The PMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout concept: a project office. Paper documents (the charter, situation briefs) sit on a cool desk surface; dashboards use the conventions PMP candidates will meet in the exam. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E3E8EE; --paper:#FCFCFA; --ink:#13243A; --muted:#58677A; --line:#CCD4DD;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#D2EAE5; --amber:#B9770E; --amber-soft:#F7E8CC;
  --bad:#B13A2D; --bad-soft:#F5DCD8; --good:#1F7A4D; --good-soft:#D7EEDF; --crit:#C2412F;
  --shadow:0 1px 0 rgba(19,36,58,.05),0 10px 30px -18px rgba(19,36,58,.45);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-sign:"Caveat","Segoe Script","Brush Script MT",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151F; --surface:#15212F; --surface-2:#1C2A3A; --paper:#182433; --ink:#E5EBF1; --muted:#97A5B4; --line:#2B3B4D;
  --accent:#4FC2AE; --accent-ink:#06211C; --accent-soft:#143A35; --amber:#E7AE4B; --amber-soft:#3A2D12;
  --bad:#F07D6F; --bad-soft:#3D201D; --good:#5ACB91; --good-soft:#163527; --crit:#F07D6F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151F; --surface:#15212F; --surface-2:#1C2A3A; --paper:#182433; --ink:#E5EBF1; --muted:#97A5B4; --line:#2B3B4D;
  --accent:#4FC2AE; --accent-ink:#06211C; --accent-soft:#143A35; --amber:#E7AE4B; --amber-soft:#3A2D12;
  --bad:#F07D6F; --bad-soft:#3D201D; --good:#5ACB91; --good-soft:#163527; --crit:#F07D6F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(44px,8vw,92px);font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(26px,3.6vw,36px);font-weight:800}
h3{font-size:20px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.stack{display:grid;gap:12px;align-content:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.grid3{grid-template-columns:1fr}} @media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.card.tight{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.must{background:var(--bad-soft);color:var(--bad)} .pill.should{background:var(--amber-soft);color:var(--amber)} .pill.could{background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--amber)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.01em}
.seal{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:13px;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4.5px var(--accent-ink)}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav button{background:none;border:0;padding:7px 11px;border-radius:6px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface)}
.savestate{font-size:12.5px;color:var(--muted)}
main{padding-block:26px 70px}
@media (max-width:640px){.top{position:static}.nav button{padding:6px 8px;font-size:14px}main{padding-block:16px 50px}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding-block:8px 30px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero .lede{font-size:19px;max-width:54ch;margin-top:16px}
.charter-mini{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:26px 26px 22px;box-shadow:var(--shadow);position:relative;transform:rotate(-1.2deg)}
.charter-mini h4{font-family:var(--f-display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.charter-mini .line{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;border-bottom:1px dashed var(--line);padding:7px 0;font-size:14.5px}
.charter-mini .line span:first-child{color:var(--muted)}
.stamp{position:absolute;right:18px;bottom:16px;border:2.5px solid var(--accent);color:var(--accent);border-radius:6px;padding:4px 10px;font-family:var(--f-display);font-weight:800;letter-spacing:.12em;font-size:13px;transform:rotate(-8deg);opacity:.85}
.signature{font-family:var(--f-sign);font-size:34px;line-height:1;color:var(--accent)}

/* project cards */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.projects{grid-template-columns:1fr}}
.proj{display:grid;gap:10px;border-top:5px solid var(--accent)}
.proj.pred{border-top-color:var(--amber)}
.proj.locked{opacity:.65;border-top-color:var(--line)}
.proj .meta{display:flex;gap:6px;flex-wrap:wrap}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.amber i{background:var(--amber)} .meter.bad i{background:var(--bad)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-block:14px 16px}
.kpis div{background:var(--surface);padding:9px 13px;min-width:0}
.kpis span{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis b{font-family:var(--f-mono);font-size:18px;font-weight:600}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}

/* backlog */
.bl{display:grid;gap:6px}
.bl label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.bl label:hover{border-color:var(--muted)}
.bl input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.bl .t{font-weight:600}
.bl .s{font-size:13.5px;color:var(--muted)}
.bl .pts{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.capbar{position:relative;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.capbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.capbar i.over{background:var(--bad)}
.capbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:var(--surface-2);border-radius:8px;padding:8px;min-height:120px}
.col h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;margin-bottom:7px;font-size:13.5px;line-height:1.3}
.kcard .pg{height:4px;background:var(--surface-2);border-radius:2px;margin-top:6px;overflow:hidden}
.kcard .pg i{display:block;height:100%;background:var(--accent)}
.kcard.re{border-left:3px solid var(--bad)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.person:hover{border-color:var(--muted)}
.person .nm{font-weight:700;line-height:1.2}
.person .tt{font-size:13px;color:var(--muted);line-height:1.25}
.av{display:block;border-radius:50%;flex:none}
.mood{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* situation */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(9,15,24,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.brief{background:var(--paper);border:1px solid var(--line);border-radius:8px;max-width:780px;width:100%;box-shadow:var(--shadow);margin-block:10px 30px}
.brief header{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.brief .body{padding:18px 22px;display:grid;gap:14px}
.line-say{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start}
.line-say .who{font-size:13px;font-weight:700}
.line-say .who span{font-weight:400;color:var(--muted)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:10px 13px;margin-top:3px}
.narr{background:var(--surface-2);border-radius:8px;padding:11px 14px;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;width:100%}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.res-best{border-color:var(--good);background:var(--good-soft)}
.opt.res-ok{border-color:var(--amber)}
.opt.res-poor.chosen{border-color:var(--bad);background:var(--bad-soft)}
.verdict{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:8px;font-weight:700}
.verdict.best{background:var(--good-soft);color:var(--good)} .verdict.ok{background:var(--amber-soft);color:var(--amber)} .verdict.poor{background:var(--bad-soft);color:var(--bad)}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.lesson{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.lens{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:15px}

/* gantt */
.gantt{width:100%;display:block}
.gantt text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.gantt .lbl{fill:var(--ink);font-size:12.5px}
.gantt .grid{stroke:var(--line)}
.gantt .base{fill:var(--surface-2);stroke:var(--line)}
.gantt .bar{fill:var(--accent-soft);stroke:var(--accent)}
.gantt .bar.crit{stroke:var(--crit);stroke-width:2}
.gantt .done{fill:var(--accent)}
.gantt .now{stroke:var(--amber);stroke-width:2;stroke-dasharray:4 3}
.gantt .rain{fill:var(--amber-soft);opacity:.6}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid{stroke:var(--line)}
svg.chart .ideal{stroke:var(--muted);stroke-dasharray:5 4;fill:none}
svg.chart .actual{stroke:var(--accent);stroke-width:2.5;fill:none}
svg.chart .pv{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:5 4}
svg.chart .ev{stroke:var(--accent);stroke-width:2.5;fill:none}
svg.chart .ac{stroke:var(--bad);stroke-width:2.5;fill:none}
svg.chart .barv{fill:var(--accent)}
svg.chart .lab{fill:var(--ink);font-weight:600}

/* stakeholder grid */
.sgrid{position:relative;aspect-ratio:1/0.8;max-width:100%;border:1px solid var(--line);border-radius:8px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,var(--surface)}
.sgrid .q{position:absolute;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px}
.sgrid .dot{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;font-size:11.5px;text-align:center;line-height:1.1;width:90px;background:none;border:0;cursor:pointer;color:var(--ink)}
.eng{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(0,1fr));font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.eng div{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.eng .h{background:var(--surface-2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.eng .C{background:var(--amber-soft);font-weight:700;text-align:center} .eng .D{background:var(--accent-soft);font-weight:700;text-align:center} .eng .CD{background:var(--good-soft);font-weight:700;text-align:center}
@media (max-width:640px){.eng{font-size:11px}}

/* exam */
.exam{max-width:920px;margin:0 auto}
.examhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px 8px 0 0}
.examhead .timer{font-family:var(--f-mono);font-size:18px;font-weight:600}
.exambody{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:22px;display:grid;gap:16px}
.case{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:15px}
.xopt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.xopt input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.xopt.struck .tx{text-decoration:line-through;color:var(--muted)}
.xopt .strike{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px}
.xopt.right{border-color:var(--good);background:var(--good-soft)} .xopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.navgrid button{height:36px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-family:var(--f-mono);font-size:12.5px;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft)} .navgrid button.flag{box-shadow:inset 0 -3px 0 var(--amber)} .navgrid button.cur{outline:2px solid var(--ink)}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
select{border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%;max-width:100%}
.hot svg [data-region]{cursor:pointer}
.hot svg [data-region]:hover rect,.hot svg [data-region]:hover circle{stroke:var(--amber);stroke-width:3}
.hot svg [data-region].sel rect,.hot svg [data-region].sel circle{stroke:var(--accent);stroke-width:3.5}
.band{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px}
.band.AT{background:var(--good-soft);color:var(--good)} .band.T{background:var(--accent-soft);color:var(--accent)} .band.BT{background:var(--amber-soft);color:var(--amber)} .band.NI{background:var(--bad-soft);color:var(--bad)}

/* eco map */
.ecomap{display:grid;gap:14px}
.ecorow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ecocell{border-radius:6px;padding:8px 9px;font-size:12.5px;line-height:1.25;border:1px solid var(--line);background:var(--surface);min-height:62px}
.ecocell b{display:block;font-family:var(--f-mono);font-size:11.5px;margin-bottom:3px;color:var(--muted)}
.ecocell.l1{background:var(--bad-soft)} .ecocell.l2{background:var(--amber-soft)} .ecocell.l3{background:var(--accent-soft)} .ecocell.l4{background:var(--good-soft)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;font-size:14.5px;max-width:min(560px,calc(100% - 32px));box-shadow:var(--shadow)}
.feed{display:grid;gap:6px;max-height:220px;overflow:auto;font-size:14px}
.feed div{padding:6px 10px;background:var(--surface-2);border-radius:6px}
input[type=text],input[type=search]{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);width:100%}
textarea{border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%;min-height:70px}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.charter-mini{transform:none}}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.choice input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* ---------- living scenes ---------- */
.top .wrap{position:relative}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn.off{color:var(--muted)}
.iconbtn.off::after{content:"";position:absolute;width:24px;height:2px;background:var(--bad);transform:rotate(-40deg);border-radius:2px}
.badgecount{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sndpop{position:absolute;right:16px;top:58px;width:min(300px,calc(100vw - 32px));z-index:70;box-shadow:var(--shadow)}
.sndrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:14.5px}
.sndrow input[type=range]{width:140px;accent-color:var(--accent)}
.tog{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;cursor:pointer;min-width:56px}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:14px 0 16px;background:#E9E4DA}
.stage svg.scene{width:100%;height:auto;display:block}
.stage-banner{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);padding:8px 10px 8px 8px;border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 24px);border:1.5px solid var(--amber)}
.stage-banner .btn{flex:none}
.stage-banner.quiet{border-color:var(--line);padding:8px 14px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pc-pulse 1s ease-in-out infinite}
@keyframes pc-pulse{50%{opacity:.25;transform:scale(.7)}}
@media (max-width:640px){.stage-banner{position:static;border-radius:0;border-width:1.5px 0 0;box-shadow:none;max-width:none}}
.sc-fig{cursor:pointer;outline:none}
.sc-fig:hover .sc-bob,.sc-fig:focus-visible .sc-bob{filter:drop-shadow(0 0 3px #E7AE4B) drop-shadow(0 0 1px #E7AE4B)}
.sc-bob{animation:sc-breathe 3.4s ease-in-out infinite}
.sc-work{animation-duration:.7s}
@keyframes sc-breathe{50%{transform:translateY(-1.6px)}}
@keyframes sc-walk{from{transform:translate(var(--fx),var(--fy))}to{transform:translate(var(--tx),var(--ty))}}
.sc-mark{animation:sc-hop .9s ease-in-out infinite}
@keyframes sc-hop{50%{transform:translateY(-6px)}}
.sc-pending .sc-bob{filter:drop-shadow(0 0 4px #E7AE4B)}
.sc-react{animation:sc-fade 6s forwards}
.sc-react.gone{display:none}
@keyframes sc-fade{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.sc-grow-y{animation:sc-gy 1.8s cubic-bezier(.3,.1,.3,1) both}
.sc-grow-x{animation:sc-gx 1.8s cubic-bezier(.3,.1,.3,1) both}
@keyframes sc-gy{from{transform:scaleY(var(--from))}to{transform:scaleY(var(--to))}}
@keyframes sc-gx{from{transform:scaleX(var(--from))}to{transform:scaleX(var(--to))}}
.sc-rain path{animation:sc-drop .55s linear infinite}
@keyframes sc-drop{from{transform:translate(0,-30px)}to{transform:translate(-12px,40px)}}
.sc-screen{animation:sc-flick 4s steps(2) infinite}
@keyframes sc-flick{50%{fill:#6FB6DE}}
.sc-name{font-size:11px;fill:#13243A;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene{filter:brightness(.84) saturate(.95)}}
:root[data-theme="dark"] .scene{filter:brightness(.84) saturate(.95)}
@media (prefers-reduced-motion:reduce){.sc-bob,.sc-mark,.sc-rain path,.sc-screen,.pulse{animation:none}.sc-fig{animation:none!important}.sc-grow-x,.sc-grow-y{animation-duration:.01s}}
.officehero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:center;margin-bottom:18px}
.officehero .stage{margin:0}
@media (max-width:860px){.officehero{grid-template-columns:1fr}}
/* ---------- chat ---------- */
.briefgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media (max-width:860px){.briefgrid{grid-template-columns:1fr}}
.small-stage{margin:0}
.chatbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.chatbox header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chatlog{height:360px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);cursor:pointer;scroll-behavior:smooth}
.drawer .chatlog{cursor:default;background:transparent;padding:0;height:auto}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .av{flex:none}
.msg .mb{background:var(--surface);border-radius:14px 14px 14px 4px;padding:9px 12px;max-width:min(82%,520px);font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.msg.me{justify-content:flex-end}
.msg.me .mb{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.msg.coach .mb{background:var(--amber-soft)}
.msg.sys{justify-content:center}
.msg.sys .verdict{padding:6px 14px;font-size:14px}
.typing{display:inline-flex;gap:4px;align-items:center;min-height:20px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pc-dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes pc-dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.typingline{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;min-height:54px;border-top:1px solid var(--line)}
.chip{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left}
.chip:hover{background:var(--accent-soft)}
.charterdoc{position:relative;background:var(--paper);padding:26px}
.crow{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:12px;border-bottom:1px dashed var(--line);padding-bottom:9px;transition:opacity .4s}
.crow:not(.on){opacity:.6}
.crow.flash{animation:pc-flash 1.6s ease-out}
@keyframes pc-flash{0%{background:var(--amber-soft)}100%{background:transparent}}
@media (max-width:520px){.crow{grid-template-columns:1fr;gap:2px}}
.ghostline{display:block}
.ghostline i{display:block;height:8px;border-radius:4px;background:var(--surface-2);margin:6px 0}
.sigdraw{animation:pc-sig 1s ease-out both}
@keyframes pc-sig{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.stamp2{position:absolute;right:26px;top:26px;border:3px solid var(--bad);color:var(--bad);border-radius:6px;padding:5px 12px;font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:16px;transform:rotate(-9deg);opacity:0}
.charterdoc.stamped .stamp2{opacity:.88;animation:pc-stamp .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pc-stamp{from{transform:rotate(-9deg) scale(2.4);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.88}}
.verdict.pop{animation:pc-popin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pc-popin{from{transform:scale(.9);opacity:0}}
.coachwrap{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:75;max-width:min(380px,calc(100% - 32px))}
.coachpop{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--amber);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.drawer{max-width:620px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.badge{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;opacity:.55}
.badge.on{opacity:1;border-color:var(--amber);background:var(--amber-soft)}
.medal{font-size:22px;color:var(--amber);line-height:1}
.top .iconbtn[data-inbox]{margin-left:auto}
@media (max-width:640px){.top .wrap{gap:8px;padding-block:8px}.top .savestate{display:none}.top .nav{order:3;flex-basis:100%}.coachwrap{bottom:calc(16px + env(safe-area-inset-bottom,0px))}.chatlog{height:320px}}
.stage{scroll-margin-top:70px}

/* ---------- 3D worlds ---------- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.stage.has3d{background:linear-gradient(#9FD0EC,#E3F2F9 70%);border-color:transparent}
.stage.has3d.wet{background:linear-gradient(#7D8B99,#C5CED6 70%)}
.w3{position:relative;height:clamp(400px,62vh,660px);width:100%}
.w3.small{height:clamp(320px,44vh,420px)}
.w3root{position:absolute;inset:0;overflow:hidden;font-family:var(--f-body,system-ui)}
.w3canvas{display:block;width:100%!important;height:100%!important;cursor:grab;touch-action:pan-y}
.w3canvas:active{cursor:grabbing}
.w3layer{position:absolute;inset:0;pointer-events:none}
.w3hud{position:absolute;inset:0;pointer-events:none}
.w3hud>*{pointer-events:auto}
.w3top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.92);color:#13243A;border-radius:999px;padding:5px 6px;box-shadow:0 4px 18px rgba(19,36,58,.16);max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
.w3pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:13px;white-space:nowrap;border-right:1px solid #E1E6EC}
.w3pill:last-child{border-right:0}
.w3pill .muted{color:#58677A}
.w3sun{width:12px;height:12px;border-radius:50%;background:#F5B83B;box-shadow:0 0 0 3px rgba(245,184,59,.25)}
.w3sun.wet{background:#8A97A5;box-shadow:0 0 0 3px rgba(138,151,165,.3)}
.w3focus{position:absolute;top:62px;left:12px;display:flex;gap:10px;align-items:flex-start;max-width:min(300px,calc(100% - 80px));background:rgba(255,255,255,.92);color:#13243A;border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.35;box-shadow:0 4px 18px rgba(19,36,58,.14)}
.w3ico{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#E6F2EF;flex:none;font-size:15px}
.w3ico.big{width:44px;height:44px;font-size:22px}
.w3ctl{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.w3b{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#13243A;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(19,36,58,.16);display:grid;place-items:center}
.w3b:hover{background:#fff}
.w3hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(19,36,58,.78);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.w3tip{position:absolute;left:0;top:0;background:rgba(19,36,58,.9);color:#fff;font-size:12px;line-height:1.3;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;margin-top:-6px}
.w3tip span{opacity:.8}
.w3bub{position:absolute;left:0;top:0;max-width:220px;background:#fff;color:#13243A;font-size:12.5px;line-height:1.3;padding:6px 10px;border-radius:12px;box-shadow:0 3px 12px rgba(19,36,58,.2);margin-top:-8px;animation:w3pop .25s ease-out}
.w3bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes w3pop{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
.w3react{position:absolute;left:0;top:0;font-size:12.5px;font-weight:800;color:#fff;padding:3px 8px;border-radius:999px}
.w3react.up{background:#1F7A4D}.w3react.down{background:#B13A2D}
.w3card{position:absolute;left:12px;bottom:12px;width:min(380px,calc(100% - 70px));max-height:calc(100% - 90px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(19,36,58,.25);border:1px solid var(--line);animation:w3pop .2s ease-out;z-index:3}
.w3x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px}
.w3who{display:flex;gap:10px;align-items:center;padding-right:24px}
.w3who b{display:block;font-family:var(--f-display);font-size:16px}
.w3say{margin:10px 0 0;font-size:14.5px;line-height:1.45}
.w3concept{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);display:flex;flex-direction:column;gap:3px}
.w3concept p{margin:4px 0 0;font-size:13.5px;line-height:1.45}
.w3chip{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.w3new{align-self:flex-start;font-size:11.5px;font-weight:800;background:var(--amber);color:#13243A;border-radius:999px;padding:2px 9px;margin-bottom:2px}
.stage.has3d .stage-banner{z-index:4}
.stage.w3full{position:fixed;inset:0;z-index:80;margin:0;border-radius:0}
.stage.w3full .w3{height:100%!important}
body.w3lock{overflow:hidden}
.officehero:has(.w3){grid-template-columns:1fr}
.w3root:has(.w3card:not([hidden])) .w3focus{display:none}
.stage.has3d:has(.stage-banner) .w3card{bottom:84px;max-height:calc(100% - 160px)}
@media (max-width:640px){.w3focus{display:none}.w3ctl{top:auto;bottom:10px;transform:none;flex-direction:row}.w3ctl [data-w3="in"],.w3ctl [data-w3="out"]{display:none}.w3hint{bottom:56px}.stage.has3d:has(.stage-banner) .w3ctl{bottom:104px}.stage.has3d:has(.stage-banner) .w3hint{display:none}.w3{height:62vh}.w3.small{height:46vh}.w3focus{top:56px;font-size:12px;max-width:calc(100% - 70px)}.w3top{top:6px}.w3pill{font-size:12px;padding:3px 7px}.w3card{left:8px;right:8px;width:auto;bottom:8px}.w3b{width:34px;height:34px}.stage.has3d .stage-banner{position:absolute;left:8px;right:8px;bottom:8px;border-radius:12px;border-width:1.5px}}
/* ===== mission board ===== */
.hq{position:relative;margin-top:18px;padding:22px 24px 26px;border-radius:20px;background:radial-gradient(120% 140% at 0% 0%,#16304A 0%,#0B1320 60%);color:#E5EBF1;overflow:visible;box-shadow:inset 0 0 0 1px rgba(79,194,174,.14),0 18px 40px -24px rgba(5,10,20,.8)}
.hq::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:linear-gradient(rgba(79,194,174,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(79,194,174,.06) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(180deg,#000,transparent 95%)}
.hqhead{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:18px;font-family:var(--f-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.hqhead span{color:#4FC2AE;font-weight:600}
.hqhead i{flex:1;height:1px;background:linear-gradient(90deg,rgba(79,194,174,.5),rgba(79,194,174,0))}
.hqhead em{font-style:normal;color:#8496A9;letter-spacing:.06em;text-transform:none;font-family:var(--f-body);font-size:13px}
.mrow{position:relative;display:flex;flex-wrap:wrap;gap:22px 18px;align-items:flex-start;justify-content:space-between}
.msep{width:1px;align-self:stretch;margin:6px 6px 30px;background:linear-gradient(180deg,transparent,rgba(229,235,241,.18),transparent)}
.mslot{position:relative;width:118px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mtile{--ring:0deg;position:relative;width:104px;height:104px;border:0;padding:0;border-radius:28px;cursor:pointer;background:none;transition:transform .18s cubic-bezier(.2,.9,.3,1.3),filter .18s}
.mtile .mring{position:absolute;inset:-5px;border-radius:33px;background:conic-gradient(#4FC2AE var(--ring),rgba(229,235,241,.12) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.mtile .mface{position:absolute;inset:0;border-radius:28px;display:flex;align-items:center;justify-content:center;background:var(--g);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.22),0 8px 0 var(--g2),0 14px 22px rgba(0,0,0,.45);overflow:hidden}
.mtile .mface::after{content:"";position:absolute;left:-20%;top:-60%;width:140%;height:90%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);transform:rotate(-12deg)}
.mtile svg{width:72px;height:72px;position:relative;z-index:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.hue-teal{--g:linear-gradient(160deg,#2FB09C,#0E6E62);--g2:#08463E}
.hue-amber{--g:linear-gradient(160deg,#F2C46B,#C9861A);--g2:#7C5209}
.hue-violet{--g:linear-gradient(160deg,#8C7BD1,#4A3D7D);--g2:#2C2450}
.hue-ice{--g:linear-gradient(160deg,#6EC0EA,#2A6F9E);--g2:#174463}
.hue-navy{--g:linear-gradient(160deg,#41679A,#1B3354);--g2:#0E1D33}
.hue-green{--g:linear-gradient(160deg,#5FCB8E,#1F7A4D);--g2:#0F4A2C}
.mslot:not(.locked) .mtile:hover,.mslot:not(.locked) .mtile:focus-visible,.mslot.show:not(.locked) .mtile{transform:translateY(-6px) scale(1.05)}
.mslot:not(.locked) .mtile:active{transform:translateY(2px) scale(.97)}
.mtile:focus-visible{outline:3px solid #E7AE4B;outline-offset:6px}
.mslot.locked .mtile{cursor:default;filter:grayscale(.85) brightness(.6)}
.mbadge{position:absolute;right:-8px;top:-8px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.mbadge svg{width:17px;height:17px;filter:none}
.mbadge.lock{background:#2B3B4D;color:#C9D3DD}
.mbadge.done{background:#E7AE4B;color:#13243A}
.mflag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.14em;background:#E7AE4B;color:#13243A;padding:3px 9px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:mbob 1.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.mname{margin-top:16px;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;color:#F2F5F8}
.msub{margin-top:3px;font-size:12px;line-height:1.25;color:#8EA0B3}
.mslot.locked .mname{color:#97A5B4}
/* popover brief */
.mpop{position:absolute;z-index:30;left:50%;top:calc(100% + 10px);width:320px;transform:translate(calc(-50% + var(--dx,0px)),6px);opacity:0;visibility:hidden;pointer-events:none;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px;box-shadow:0 22px 50px -10px rgba(5,10,20,.55);display:grid;gap:8px;transition:opacity .16s,transform .16s,visibility 0s .16s}
.mpop::before{content:"";position:absolute;left:calc(50% - var(--dx,0px));top:-7px;width:12px;height:12px;margin-left:-6px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.mpop h3{font-size:19px}
.mpop .meta{display:flex;gap:6px;flex-wrap:wrap}
.mpop.sm{width:240px;gap:4px}
.mslot:hover .mpop,.mslot:focus-within .mpop,.mslot.show .mpop{opacity:1;visibility:visible;pointer-events:auto;transform:translate(calc(-50% + var(--dx,0px)),0);transition:opacity .16s,transform .16s,visibility 0s}
.mslot:hover,.mslot:focus-within,.mslot.show{z-index:40}
/* trophies */
.medals{position:relative;display:flex;flex-wrap:wrap;gap:14px}
.medal-slot{width:auto}
.medal{width:54px;height:54px;border-radius:50%;border:2px dashed rgba(229,235,241,.22);background:rgba(229,235,241,.04);color:#5D6E80;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:default;transition:transform .15s}
.medal.on{border:0;color:#13243A;background:radial-gradient(circle at 35% 30%,#FBE3A8,#E7AE4B 55%,#B9770E);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 4px rgba(231,174,75,.18),0 8px 16px rgba(0,0,0,.4)}
.medal:hover,.medal:focus-visible{transform:scale(1.1)}
.medal:focus-visible{outline:3px solid #E7AE4B;outline-offset:3px}
