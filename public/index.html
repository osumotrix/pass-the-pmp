<style>
/* Layout concept: a project office. Paper documents (the charter, situation briefs) sit on a cool desk surface; dashboards use the conventions PMP candidates will meet in the exam. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E3E8EE; --paper:#FCFCFA; --ink:#13243A; --muted:#58677A; --line:#CCD4DD;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#D2EAE5; --amber:#B9770E; --amber-soft:#F7E8CC;
  --bad:#B13A2D; --bad-soft:#F5DCD8; --good:#1F7A4D; --good-soft:#D7EEDF; --crit:#C2412F;
  --shadow:0 1px 0 rgba(19,36,58,.05),0 10px 30px -18px rgba(19,36,58,.45);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-sign:"Caveat","Segoe Script","Brush Script MT",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151F; --surface:#15212F; --surface-2:#1C2A3A; --paper:#182433; --ink:#E5EBF1; --muted:#97A5B4; --line:#2B3B4D;
  --accent:#4FC2AE; --accent-ink:#06211C; --accent-soft:#143A35; --amber:#E7AE4B; --amber-soft:#3A2D12;
  --bad:#F07D6F; --bad-soft:#3D201D; --good:#5ACB91; --good-soft:#163527; --crit:#F07D6F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151F; --surface:#15212F; --surface-2:#1C2A3A; --paper:#182433; --ink:#E5EBF1; --muted:#97A5B4; --line:#2B3B4D;
  --accent:#4FC2AE; --accent-ink:#06211C; --accent-soft:#143A35; --amber:#E7AE4B; --amber-soft:#3A2D12;
  --bad:#F07D6F; --bad-soft:#3D201D; --good:#5ACB91; --good-soft:#163527; --crit:#F07D6F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(44px,8vw,92px);font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(26px,3.6vw,36px);font-weight:800}
h3{font-size:20px;font-weight:700}
h4{font-size:16px;font-weight:700}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.stack{display:grid;gap:12px;align-content:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.grid3{grid-template-columns:1fr}} @media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.card.tight{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.must{background:var(--bad-soft);color:var(--bad)} .pill.should{background:var(--amber-soft);color:var(--amber)} .pill.could{background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--amber)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:800;letter-spacing:-.01em}
.seal{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:13px;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4.5px var(--accent-ink)}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav button{background:none;border:0;padding:7px 11px;border-radius:6px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface)}
.savestate{font-size:12.5px;color:var(--muted)}
main{padding-block:26px 70px}
@media (max-width:640px){.top{position:static}.nav button{padding:6px 8px;font-size:14px}main{padding-block:16px 50px}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"copy art";gap:28px;align-items:center;padding-block:8px 30px}
.hero-copy{grid-area:copy;min-width:0}
.hero .lede{font-size:21px;line-height:1.4;max-width:44ch;margin-top:14px}.hero .lede .nobr{white-space:nowrap}
.hero-form{margin-top:24px;max-width:420px}
.hero-art{grid-area:art;margin:0;min-width:0;position:relative}
.hero-art img{display:block;width:100%;height:auto;filter:drop-shadow(0 28px 30px rgba(19,36,58,.22));animation:heroFloat 7s ease-in-out infinite}
.hero-art::after{content:"";position:absolute;left:14%;right:14%;bottom:-6px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(19,36,58,.18),transparent);z-index:-1}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h1{font-size:clamp(44px,5.4vw,80px);white-space:nowrap}
@media (max-width:860px){.hero{display:flex;flex-direction:column;align-items:stretch;gap:0}.hero-copy{display:contents}.hero h1{white-space:normal}.hero .lede{font-size:19px}.hero-art{order:3;width:100%;max-width:520px;margin:14px auto 0}.hero-form{order:4;max-width:none;margin-top:18px}}
.charter-mini{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:26px 26px 22px;box-shadow:var(--shadow);position:relative;transform:rotate(-1.2deg)}
.charter-mini h4{font-family:var(--f-display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.charter-mini .line{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;border-bottom:1px dashed var(--line);padding:7px 0;font-size:14.5px}
.charter-mini .line span:first-child{color:var(--muted)}
.stamp{position:absolute;right:18px;bottom:16px;border:2.5px solid var(--accent);color:var(--accent);border-radius:6px;padding:4px 10px;font-family:var(--f-display);font-weight:800;letter-spacing:.12em;font-size:13px;transform:rotate(-8deg);opacity:.85}
.signature{font-family:var(--f-sign);font-size:34px;line-height:1;color:var(--accent)}

/* project cards */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.projects{grid-template-columns:1fr}}
.proj{display:grid;gap:10px;border-top:5px solid var(--accent)}
.proj.pred{border-top-color:var(--amber)}
.proj.locked{opacity:.65;border-top-color:var(--line)}
.proj .meta{display:flex;gap:6px;flex-wrap:wrap}
.meter{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.amber i{background:var(--amber)} .meter.bad i{background:var(--bad)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-block:14px 16px}
.kpis div{background:var(--surface);padding:9px 13px;min-width:0}
.kpis span{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis b{font-family:var(--f-mono);font-size:18px;font-weight:600}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}

/* backlog */
.bl{display:grid;gap:6px}
.bl label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.bl label:hover{border-color:var(--muted)}
.bl input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.bl .t{font-weight:600}
.bl .s{font-size:13.5px;color:var(--muted)}
.bl .pts{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.capbar{position:relative;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.capbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.capbar i.over{background:var(--bad)}
.capbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:var(--surface-2);border-radius:8px;padding:8px;min-height:120px}
.col h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;margin-bottom:7px;font-size:13.5px;line-height:1.3}
.kcard .pg{height:4px;background:var(--surface-2);border-radius:2px;margin-top:6px;overflow:hidden}
.kcard .pg i{display:block;height:100%;background:var(--accent)}
.kcard.re{border-left:3px solid var(--bad)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.person:hover{border-color:var(--muted)}
.person .nm{font-weight:700;line-height:1.2}
.person .tt{font-size:13px;color:var(--muted);line-height:1.25}
.av{display:block;border-radius:50%;flex:none}
.mood{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* situation */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(9,15,24,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.brief{background:var(--paper);border:1px solid var(--line);border-radius:8px;max-width:780px;width:100%;box-shadow:var(--shadow);margin-block:10px 30px}
.brief header{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.brief .body{padding:18px 22px;display:grid;gap:14px}
.line-say{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start}
.line-say .who{font-size:13px;font-weight:700}
.line-say .who span{font-weight:400;color:var(--muted)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:10px 13px;margin-top:3px}
.narr{background:var(--surface-2);border-radius:8px;padding:11px 14px;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;width:100%}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.res-best{border-color:var(--good);background:var(--good-soft)}
.opt.res-ok{border-color:var(--amber)}
.opt.res-poor.chosen{border-color:var(--bad);background:var(--bad-soft)}
.verdict{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:8px;font-weight:700}
.verdict.best{background:var(--good-soft);color:var(--good)} .verdict.ok{background:var(--amber-soft);color:var(--amber)} .verdict.poor{background:var(--bad-soft);color:var(--bad)}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.lesson{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.lens{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:15px}

/* gantt */
.gantt{width:100%;display:block}
.gantt text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.gantt .lbl{fill:var(--ink);font-size:12.5px}
.gantt .grid{stroke:var(--line)}
.gantt .base{fill:var(--surface-2);stroke:var(--line)}
.gantt .bar{fill:var(--accent-soft);stroke:var(--accent)}
.gantt .bar.crit{stroke:var(--crit);stroke-width:2}
.gantt .done{fill:var(--accent)}
.gantt .now{stroke:var(--amber);stroke-width:2;stroke-dasharray:4 3}
.gantt .rain{fill:var(--amber-soft);opacity:.6}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg.chart .grid{stroke:var(--line)}
svg.chart .ideal{stroke:var(--muted);stroke-dasharray:5 4;fill:none}
svg.chart .actual{stroke:var(--accent);stroke-width:2.5;fill:none}
svg.chart .pv{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:5 4}
svg.chart .ev{stroke:var(--accent);stroke-width:2.5;fill:none}
svg.chart .ac{stroke:var(--bad);stroke-width:2.5;fill:none}
svg.chart .barv{fill:var(--accent)}
svg.chart .lab{fill:var(--ink);font-weight:600}

/* stakeholder grid */
.sgrid{position:relative;aspect-ratio:1/0.8;max-width:100%;border:1px solid var(--line);border-radius:8px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,var(--surface)}
.sgrid .q{position:absolute;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px}
.sgrid .dot{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;font-size:11.5px;text-align:center;line-height:1.1;width:90px;background:none;border:0;cursor:pointer;color:var(--ink)}
.eng{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(5,minmax(0,1fr));font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.eng div{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.eng .h{background:var(--surface-2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.eng .C{background:var(--amber-soft);font-weight:700;text-align:center} .eng .D{background:var(--accent-soft);font-weight:700;text-align:center} .eng .CD{background:var(--good-soft);font-weight:700;text-align:center}
@media (max-width:640px){.eng{font-size:11px}}

/* exam */
.exam{max-width:920px;margin:0 auto}
.examhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px 8px 0 0}
.examhead .timer{font-family:var(--f-mono);font-size:18px;font-weight:600}
.exambody{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:22px;display:grid;gap:16px}
.case{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:15px}
.xopt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.xopt input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.xopt.struck .tx{text-decoration:line-through;color:var(--muted)}
.xopt .strike{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px}
.xopt.right{border-color:var(--good);background:var(--good-soft)} .xopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.navgrid button{height:36px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-family:var(--f-mono);font-size:12.5px;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft)} .navgrid button.flag{box-shadow:inset 0 -3px 0 var(--amber)} .navgrid button.cur{outline:2px solid var(--ink)}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
select{border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%;max-width:100%}
.hot svg [data-region]{cursor:pointer}
.hot svg [data-region]:hover rect,.hot svg [data-region]:hover circle{stroke:var(--amber);stroke-width:3}

.mflag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.14em;background:#E7AE4B;color:#13243A;padding:3px 9px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:mbob 1.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.mname{margin-top:16px;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;color:#F2F5F8}
.msub{margin-top:3px;font-size:12px;line-height:1.25;color:#8EA0B3}
.mslot.locked .mname{color:#97A5B4}
/* popover brief */
.mpop{position:absolute;z-index:30;left:50%;top:calc(100% + 10px);width:320px;transform:translate(calc(-50% + var(--dx,0px)),6px);opacity:0;visibility:hidden;pointer-events:none;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px;box-shadow:0 22px 50px -10px rgba(5,10,20,.55);display:grid;gap:8px;transition:opacity .16s,transform .16s,visibility 0s .16s}
.mpop::before{content:"";position:absolute;left:calc(50% - var(--dx,0px));top:-7px;width:12px;height:12px;margin-left:-6px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.mpop h3{font-size:19px}
.mpop .meta{display:flex;gap:6px;flex-wrap:wrap}
.mpop.sm{width:240px;gap:4px}
.mslot:hover .mpop,.mslot:focus-within .mpop,.mslot.show .mpop{opacity:1;visibility:visible;pointer-events:auto;transform:translate(calc(-50% + var(--dx,0px)),0);transition:opacity .16s,transform .16s,visibility 0s}
.mslot:hover,.mslot:focus-within,.mslot.show{z-index:40}
/* trophies */
.medals{position:relative;display:flex;flex-wrap:wrap;gap:14px}
.medal-slot{width:auto}
.medal{width:54px;height:54px;border-radius:50%;border:2px dashed rgba(229,235,241,.22);background:rgba(229,235,241,.04);color:#5D6E80;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:default;transition:transform .15s}
.medal.on{border:0;color:#13243A;background:radial-gradient(circle at 35% 30%,#FBE3A8,#E7AE4B 55%,#B9770E);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 4px rgba(231,174,75,.18),0 8px 16px rgba(0,0,0,.4)}
.medal:hover,.medal:focus-visible{transform:scale(1.1)}
.medal:focus-visible{outline:3px solid #E7AE4B;outline-offset:3px}
@media (max-width:640px){
  .hq{padding:18px 14px 20px;border-radius:16px}
  .hqhead em{display:none}
  .mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 8px}
  .msep{display:none}
  .mslot{width:auto}
  .mtile{width:84px;height:84px;border-radius:24px}.mtile .mface{border-radius:24px}.mtile .mring{border-radius:29px}
  .mtile svg{width:58px;height:58px}
  .mname{font-size:13.5px}
  .mslot:hover .mpop{opacity:0;visibility:hidden}
  .mpop,.mpop.sm{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;transform:translateY(16px);box-shadow:0 -10px 40px rgba(5,10,20,.45)}
  .mslot.show{z-index:78}
  .mpop::before{display:none}
  .mslot.show .mpop{opacity:1;visibility:visible;pointer-events:auto;transform:none}
  .mslot:focus-within:not(.show) .mpop{opacity:0;visibility:hidden}
}
@media (prefers-reduced-motion:reduce){.mflag{animation:none}.mtile,.mpop{transition:none}}
.adkar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end}
.adkar .ak{border-radius:10px;padding:8px 6px;text-align:center;background:var(--surface-2);color:var(--muted);font-size:12.5px;line-height:1.2;display:flex;flex-direction:column;gap:4px}
.adkar .ak b{font-family:var(--f-display);font-size:18px}
.adkar .ak:nth-child(1){min-height:64px}.adkar .ak:nth-child(2){min-height:78px}.adkar .ak:nth-child(3){min-height:92px}.adkar .ak:nth-child(4){min-height:106px}.adkar .ak:nth-child(5){min-height:120px}
.adkar .ak.done{background:#D8D1EF;color:#3A2F66}
.adkar .ak.now{background:#7A6BB3;color:#fff;box-shadow:0 6px 16px -6px rgba(74,61,125,.6)}
@media (max-width:640px){.adkar{gap:4px}.adkar .ak{font-size:9.5px;padding:6px 2px;overflow-wrap:anywhere;hyphens:auto}.adkar .ak b{font-size:15px}}

  def({ id: "A1", at: { sprint: 1, phase: "planning" }, title: "The first sprint commitment", eco: ["People", 3], also: ["Process", 8], principle: "servant",
    scene: c => [["po", `We need to show progress fast. I'd like the team to commit to all six must-have stories this sprint. That's about forty points.`], ["be1", `Forty? We haven't worked together before. Our capacity estimate is closer to eighteen.`], ["po", `${c.s("sponsor")} will look at this sprint closely. Can't we stretch?`]],
    q: "Sprint planning is under way. What should you do?",
    options: [
      { grade: "poor", text: c => `Agree to forty points to show commitment, and ask the team to work late if needed.`, fx: { team: -8, debt: 0.05, support: { po: 6 } }, out: c => `${c.s("po")} is pleased. The team goes quiet, and ${c.s("be1")} mutters that the plan was decided for them.` },
      { grade: "best", text: c => `Help the team forecast from its capacity, let the developers decide how much they can commit to, and agree a sprint goal with ${c.s("po")} built from the highest-value stories.`, fx: { team: 4, support: { po: 2 } }, out: c => `The team commits to the highest-priority stories that fit its capacity and agrees a clear sprint goal. ${c.s("po")} is not thrilled, but understands the reasoning.` },
      { grade: "ok", text: c => `Split the difference at about thirty points so both sides get something.`, fx: { team: -3, debt: 0.02, support: { po: 2 } }, out: c => `Nobody is fully happy. The commitment is still above the team's forecast.` },
      { grade: "poor", text: c => `Escalate to ${c.s("sponsor")} and ask ${c.him("sponsor")} to set the sprint scope.`, fx: { team: -2, support: { po: -8, sponsor: -3 } }, out: c => `${c.s("sponsor")} asks why a planning question has reached ${c.him("sponsor")} on day one. ${c.s("po")} feels undermined.` },
    ],
    apply: (S, people, grade) => { S.flags = S.flags || {}; S.flags.a1 = grade; },
    lesson: c => `In agile work the developers own the sprint commitment. Your role as a servant leader is to make capacity visible, protect a sustainable pace and help the product owner pick the stories that deliver the most value. Committing a team to work it cannot do produces technical debt, burnout and missed goals.`,
    lens: `Exam questions often describe pressure to over-commit. The best answer lets the team decide its commitment, uses velocity or capacity as evidence, and keeps the product owner focused on priority rather than volume.` });

  def({ id: "A2", at: { sprint: 1, day: 3 }, title: "The stand-up that became a status meeting", eco: ["People", 3], principle: "servant",
    scene: c => [["narr", `Day four. The daily stand-up has run for thirty-five minutes. ${c.n("loud")} is walking through every task in detail, looking at you after each point. ${c.n("quiet")} hasn't spoken. Two people are checking their phones.`]],
    q: "What should you do?",
    options: [
      { grade: "ok", text: c => `Ask everyone to send you a written status update instead of speaking.`, fx: { team: -3 }, out: c => `Updates arrive in your inbox, but the team stops talking to each other. Two blockers stay hidden for days.` },
      { grade: "best", text: c => `Remind the team the stand-up is for them to coordinate, not to report to you. Suggest a 15-minute timebox focused on progress to the sprint goal and blockers, and take detailed problem-solving offline.`, fx: { team: 4, vel: 0.04, morale: { quiet: 6 } }, out: c => `The next stand-up takes twelve minutes. ${c.s("quiet")} raises a blocker for the first time, and the team solves it that afternoon.` },
      { grade: "poor", text: c => `Cancel the stand-up; it is wasting time.`, fx: { team: -2, vel: -0.04 }, out: c => `Without a daily check-in, two developers build the same API endpoint.` },
      { grade: "poor", text: c => `Take over and run the stand-up yourself, asking each person for their hours worked.`, fx: { team: -6 }, out: c => `The stand-up is short now, but it feels like a roll call. The team stops raising problems.` },
    ],
    lesson: c => `The daily stand-up belongs to the team. A servant leader coaches the team to keep it short and useful, and moves detailed discussion to smaller follow-up conversations. If the team reports to the project manager, it stops self-organising.`,
    lens: `Watch for answers where the project manager "takes control". In agile questions, coaching and facilitation usually beat directing.` });

  def({ id: "A8", at: { sprint: 1, phase: "review" }, title: "Customer operations stays away", eco: ["People", 4], principle: "people",
    scene: c => [["narr", `At the sprint review, everyone attends except ${c.n("ops")}, ${c.t("ops")}. Afterwards you hear ${c.he("ops")} has told colleagues the feature will "flood the call centre with angry àjọ members".`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Ask ${c.s("sponsor")} to instruct ${c.s("ops")} to attend future reviews.`, fx: { support: { ops: -10, sponsor: -2 } }, out: c => `${c.s("ops")} attends the next review in silence and leaves early.` },
      { grade: "best", text: c => `Meet ${c.s("ops")} to understand ${c.his("ops")} concerns, then invite ${c.him("ops")} to shape support needs in the backlog and attend reviews.`, fx: { support: { ops: 22 }, aware: "ops", add: "K20" }, out: c => `${c.s("ops")} explains that the last app launch doubled call volumes. Together with ${c.s("po")} you add help screens and support scripts to the backlog. ${c.s("ops")} agrees to attend reviews.` },
      { grade: "ok", text: c => `Email ${c.s("ops")} the review recording and minutes.`, fx: { support: { ops: 2 } }, out: c => `The email is read, but nothing changes in ${c.his("ops")} view.` },
      { grade: "poor", text: c => `Leave it; ${c.s("ops")} is not part of the delivery team.`, fx: { support: { ops: -6 } }, out: c => `The resistance grows quietly and will matter at launch.` },
    ],
    lesson: c => `Stakeholder resistance usually has a reason. Engage directly, listen, and turn concerns into requirements. A resistant stakeholder with high power can stop a launch; an engaged one can make it succeed.`,
    lens: `For stakeholder questions, the best first action is usually to talk to the stakeholder and understand their concern before escalating or documenting.` });

  def({ id: "A5", at: { sprint: 2, day: 2 }, title: "A regulatory requirement appears", eco: ["Business Environment", 2], also: ["Process", 2], principle: "ethics",
    scene: c => [["compliance", `I've reviewed the design. Group wallets can't exceed the members' KYC tier limits under the Central Bank's rules. A Tier 1 customer can't hold a group payout above their limit. This has to be in before launch.`], ["po", `That wasn't in the original requirements. Can it wait for a later release?`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Agree with ${c.s("po")} to defer it to a later release to protect the timeline.`, fx: { support: { compliance: -18 }, flag: "kycDeferred" }, out: c => `${c.s("compliance")} records an objection. Launching without the control would breach regulation.` },
      { grade: "best", text: c => `Work with ${c.s("compliance")} and ${c.s("po")} to understand the requirement, add it to the backlog as a must-have for release, assess its impact on the plan, and update the risk register.`, fx: { support: { compliance: 14, po: -2 }, add: "K8" }, out: c => `The KYC tier story is added as a must-have. ${c.s("po")} reorders the backlog, and ${c.s("compliance")} agrees to review it in the next sprint.` },
      { grade: "ok", text: c => `Ask the developers to start building it immediately within this sprint.`, fx: { add: "K8", vel: -0.06, team: -3 }, out: c => `The team stops planned work to start the story. The sprint goal slips.` },
      { grade: "poor", text: c => `Ask ${c.s("compliance")} for a waiver because the product is a pilot.`, fx: { support: { compliance: -10 } }, out: c => `${c.s("compliance")} declines firmly: there is no pilot exemption for these limits.` },
    ],
    lesson: c => `Compliance requirements are not optional, and they are not the project's to waive. Bring them into the backlog with the product owner, prioritise them for release, and treat the impact transparently. Starting work mid-sprint without the product owner bypasses the team's agreed way of working.`,
    lens: `When a new regulation affects a project, the best answer complies, assesses impact, and updates plans through the agreed process. Answers that defer, ignore or seek exemptions from regulations are wrong.` });

  def({ id: "A3", at: { sprint: 2, day: 6 }, title: "Two engineers disagree", eco: ["People", 2], principle: "people",
    scene: c => [["clashA", `I've said it twice: the payout scheduler should be its own service. If we bolt it onto the wallet module we'll regret it.`], ["clashB", `And I've said we don't have time to build and run a new service. You always want the perfect architecture.`], ["narr", `The argument has delayed work on the payout story for two days, and others on the team are taking sides.`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Decide the architecture yourself to stop the delay.`, fx: { team: -5, morale: { clashA: -6, clashB: -2 } }, out: c => `Work restarts, but ${c.s("clashA")} disengages and stops suggesting improvements.` },
      { grade: "best", text: c => `Meet ${c.s("clashA")} and ${c.s("clashB")} together, help them agree the decision criteria (time, risk, cost to run), and support the team to make the call, perhaps with a short spike.`, fx: { rapport: ["clashA", "clashB", 0.2], team: 3, vel: 0.03 }, out: c => `They agree a one-day spike. The data favours a module with a clean interface that can be split out later. Both feel heard.` },
      { grade: "ok", text: c => `Ask ${c.s("po")} to decide, since it affects delivery.`, fx: { team: -2 }, out: c => `${c.s("po")} picks one option without technical context. The disagreement returns a week later.` },
      { grade: "poor", text: c => `Raise it with their line manager at Bluegate.`, fx: { team: -6, rapport: ["clashA", "clashB", -0.1] }, out: c => `Both engineers feel reported. Trust in you drops.` },
    ],
    lesson: c => `Address conflict directly and early, and aim for collaboration: agree the criteria, then let the people with the expertise decide. Technical decisions belong to the team, not the product owner. Escalation comes only after your own attempts fail.`,
    lens: `Conflict questions reward collaborating or problem-solving. Forcing, smoothing over and escalating first are usually wrong answers.` });

  def({ id: "A14", at: { sprint: 2, phase: "retro" }, title: "A silent retrospective", eco: ["Business Environment", 6], also: ["People", 3], principle: "learn",
    scene: c => [["narr", `You open the retrospective. Silence. Eventually ${c.n("loud")} says the sprint was "fine". ${c.n("qa")} looks down. Later, in the corridor, you hear two engineers blaming testing for the missed stories.`]],
    q: "What should you do?",
    options: [
      { grade: "poor", text: c => `End the retrospective early; the team clearly has nothing to raise.`, fx: { team: -3 }, out: c => `The blame continues in private, and nothing improves.` },
      { grade: "best", text: c => `Use a structured format, such as silent writing on what helped and what got in the way, and focus on the process rather than individuals so people feel safe to speak.`, fx: { team: 5, morale: { qa: 8 }, rapport: ["clashA", "qa", 0.1] }, out: c => `Sticky notes reveal that stories reach testing all at once on the last two days. The team agrees to finish work earlier and help with testing.` },
      { grade: "poor", text: c => `Address the blame directly by asking ${c.s("qa")} to explain why testing was slow.`, fx: { morale: { qa: -12 }, team: -4 }, out: c => `${c.s("qa")} feels singled out in front of the team.` },
      { grade: "ok", text: c => `Write the improvement actions yourself and share them after the meeting.`, fx: { team: -1 }, out: c => `The actions are sensible, but the team doesn't own them.` },
    ],
    lesson: c => `Retrospectives only work when people feel safe. Structured techniques, a focus on the system rather than individuals, and team-owned actions build continuous improvement.`,
    lens: `For continuous improvement, the exam favours team-led retrospectives and lessons learned throughout the project, not only at the end.` });

  def({ id: "A9", at: { sprint: 3, phase: "planning" }, title: "The sponsor wants a date", eco: ["People", 5], also: ["Process", 3], principle: "value",
    scene: c => [["sponsor", `The board meets next month. I need to tell them the date every feature in the backlog will be live. A firm date.`]],
    q: "How should you respond?",
    options: [
      { grade: "poor", text: c => `Give the date the board would like and push the team to hit it.`, fx: { support: { sponsor: 6 }, team: -6, debt: 0.04, flag: "promisedAll" }, out: c => `${c.s("sponsor")} is happy for now. The team sees the promise in the board pack and loses trust.` },
      { grade: "best", text: c => `Show the velocity so far and forecast a likely range. With ${c.s("po")}, agree which must-have features can be committed to for the launch date and which will follow.`, fx: { support: { sponsor: 4, po: 4 }, flag: "forecast" }, out: c => `You present a burn-up with a range. ${c.s("sponsor")} takes the must-have release to the board with a confident date and lists later features as a roadmap.` },
      { grade: "ok", text: c => `Pad every estimate by 50% and give a single safe date.`, fx: { support: { sponsor: -2 } }, out: c => `The date is safe but late, and the board asks why it took so long.` },
      { grade: "poor", text: c => `Explain that agile projects cannot give dates.`, fx: { support: { sponsor: -12 } }, out: c => `${c.s("sponsor")} is frustrated: "Then what am I paying for?"` },
    ],
    lesson: c => `Agile teams can forecast. Use empirical data such as velocity to give a range, and work with the product owner to fix the date and flex the scope, starting with the highest value. That aligns stakeholder expectations without false promises.`,
    lens: `Questions about deadlines in agile work reward data-based forecasts and scope negotiation by value, not padding, false certainty or refusal.` });

  def({ id: "A6", at: { sprint: 3, day: 4 }, cond: (S) => S.sprintItems.length > 0, title: "Work piles up in testing", eco: ["Process", 7], also: ["Business Environment", 6], principle: "servant",
    scene: c => [["qa", `I have five stories waiting to test and they all arrived at once. I can't test five stories properly in three days.`], ["be2", `We're done with our part. Testing is the bottleneck.`]],
    q: "What should you do?",
    options: [
      { grade: "poor", text: c => `Ask ${c.s("qa")} to test faster by skipping regression checks.`, fx: { debt: 0.08, morale: { qa: -8 } }, out: c => `Stories pass faster, and two defects slip into the release build.` },
      { grade: "best", text: c => `Help the team see the bottleneck, encourage developers to swarm on testing and finish stories before starting new ones, and suggest limiting work in progress.`, fx: { swarm: true, team: 3, morale: { qa: 8 } }, out: c => `Two developers pair with ${c.s("qa")} on automated tests. The queue clears and the team proposes a WIP limit.` },
      { grade: "ok", text: c => `Request another tester from Bluegate's resource pool.`, fx: { budget: 1.2 }, out: c => `A contractor arrives in five days, after the sprint ends.` },
      { grade: "poor", text: c => `Mark the stories done; they can be tested next sprint.`, fx: { debt: 0.1, support: { po: -4 } }, out: c => `${c.s("po")} rejects them at review: they don't meet the definition of done.` },
    ],
    apply: (S) => { S.mods._swarmNow = S._lastGrade === "best"; },
    lesson: c => `Quality is built in, not inspected in at the end. When work piles up in testing, the whole team owns the flow: limit work in progress, swarm on the bottleneck, and never weaken the definition of done to hit a number.`,
    lens: `The exam treats the definition of done as non-negotiable. Look for answers that improve flow (WIP limits, swarming) rather than cut quality.` });

  def({ id: "A10", at: { sprint: 4, day: 1 }, title: "A key engineer resigns", eco: ["People", 7], also: ["Process", 4], principle: "risk",
    scene: c => [["leaver", `I wanted you to hear it from me first. I've accepted an offer abroad. My last day is in three weeks.`], ["narr", `${c.s("leaver")} wrote most of the wallet integration, and much of it is undocumented.`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Ask ${c.s("leaver")} to keep the news quiet so the team isn't unsettled.`, fx: { team: -5 }, out: c => `The news leaks within a day, and the team wonders what else you are hiding.` },
      { grade: "best", text: c => `Thank ${c.s("leaver")}, then agree a knowledge transfer plan: pair ${c.him("leaver")} with others on the wallet code, record key decisions, and update the resource plan and risk register with ${c.s("po")} and Bluegate.`, fx: { kt: 2, team: 2 }, out: c => `${c.s("leaver")} spends the last three weeks pairing and writing architecture notes. The team records a short video walk-through of the wallet integration.` },
      { grade: "ok", text: c => `Ask Bluegate to recruit a replacement immediately.`, fx: { kt: 0, budget: 1.5 }, out: c => `Recruitment starts, but a new hire will not arrive before ${c.s("leaver")} leaves.` },
      { grade: "poor", text: c => `Offer ${c.s("leaver")} a large bonus from the project budget to stay.`, fx: { budget: 4, kt: 0, support: { sponsor: -6 } }, out: c => `You have no authority to offer pay. Bluegate HR overrules you, and ${c.s("leaver")} leaves anyway.` },
    ],
    apply: (S, people, grade) => { const kt = grade === "best" ? 2 : 0; S.flags = S.flags || {}; S.flags.kt = kt + (S.flags.pairing || 0); S.leaveIn = 1; },
    lesson: c => `People leave. A project manager reduces single points of failure early (pairing, documentation, shared ownership) and, when someone resigns, plans knowledge transfer before they go and updates the resource plan and risk register.`,
    lens: `Knowledge transfer is a People task in the current exam. Look for answers that capture and share knowledge rather than only replacing the person.` });

  def({ id: "A4", at: { sprint: 4, day: 5 }, title: "An urgent request mid-sprint", eco: ["Business Environment", 3], also: ["Process", 2], principle: "process",
    scene: c => [["po", `The CEO wants a dashboard of group savings totals for a board demo next Thursday. Can the team just slot it in this sprint?`], ["mo1", `We're halfway through the sprint. Something would have to give.`]],
    q: "What should you do?",
    options: [
      { grade: "poor", text: c => `Add it to the sprint immediately; the CEO outranks the plan.`, fx: { scopeNow: "K18", team: -4, vel: -0.05 }, out: c => `The team context-switches. The dashboard ships, but the sprint goal is missed.` },
      { grade: "best", text: c => `Discuss with ${c.s("po")} how the request affects the sprint goal. If it truly cannot wait, the team decides what it can swap out; otherwise it goes to the top of the backlog for next sprint.`, fx: { add: "K18", support: { po: 3 } }, out: c => `${c.s("po")} confirms the demo can use a mock-up made by ${c.s("ux")}. The real dashboard goes to the top of the next sprint.` },
      { grade: "ok", text: c => `Ask the team to build it in overtime this weekend.`, fx: { add: "K18", overtime: 1, team: -5 }, out: c => `The dashboard is ready, but the team is tired going into the next sprint.` },
      { grade: "poor", text: c => `Refuse; nothing can change during a sprint.`, fx: { support: { po: -8, sponsor: -4 } }, out: c => `${c.s("po")} goes around you to the developers directly.` },
    ],
    lesson: c => `In Scrum, the product owner manages the backlog and the developers manage the sprint. New work normally waits for the next sprint; if it truly cannot, the product owner and team renegotiate scope together while protecting the sprint goal.`,
    lens: `Mid-sprint change questions reward protecting the sprint goal and routing new work through the product owner and backlog, not automatic acceptance or flat refusal.` });

  def({ id: "A12", at: { sprint: 4, phase: "review" }, title: "Feedback from the market", eco: ["Process", 3], also: ["People", 4], principle: "value",
    scene: c => [["rep", `It's a good app. But half of my members use small phones with no data. My mother has been in our àjọ for thirty years and she will never download an app. Can they pay by USSD?`]],
    q: "What should you do?",
    options: [
      { grade: "ok", text: c => `Promise ${c.s("rep")} that USSD will be in the next release.`, fx: { support: { rep: 8, po: -6 }, add: "K17" }, out: c => `${c.s("rep")} is delighted. ${c.s("po")} is annoyed that you set priorities without ${c.him("po")}.` },
      { grade: "best", text: c => `Thank ${c.s("rep")}, capture the need as a backlog item, and work with ${c.s("po")} to weigh its value against other items.`, fx: { support: { rep: 10, po: 3 }, add: "K17" }, out: c => `${c.s("po")} ranks USSD contributions high because it widens the market. ${c.s("rep")} is invited back for the next review.` },
      { grade: "poor", text: c => `Explain politely that USSD is out of scope.`, fx: { support: { rep: -12 } }, out: c => `${c.s("rep")} tells members the bank isn't building it for people like them.` },
      { grade: "poor", text: c => `Ask the team to start a USSD prototype straight away.`, fx: { vel: -0.04, support: { po: -5 } }, out: c => `The team is pulled off planned work, and ${c.s("po")} is bypassed.` },
    ],
    lesson: c => `Sprint reviews exist to inspect the product with real stakeholders and adapt. Capture feedback in the backlog, and let the product owner prioritise by value. Promising features yourself undermines the product owner.`,
    lens: `For value-based delivery, the best answers route new needs through the backlog and product owner and prioritise by business value.` });

  def({ id: "A11", at: { sprint: 5, day: 3 }, title: "A vulnerability in a supplier's SDK", eco: ["Business Environment", 4], also: ["Business Environment", 5], principle: "risk",
    scene: c => [["security", `The payments SDK we use has a published critical vulnerability. A patched version is out, but upgrading touches the wallet integration.`], ["be2", `If we upgrade now we'll miss two stories this sprint.`]],
    q: "What should you do first?",
    options: [
      { grade: "best", text: c => `Log it as an issue, assess the impact with ${c.s("security")} and the team, and work with ${c.s("po")} to prioritise the fix ahead of new features.`, fx: { add: "K19", aware: "security", support: { security: 15, po: 2 } }, out: c => `The fix is prioritised into the sprint, and two lower-value stories move out. ${c.s("security")} reviews the patch.` },
      { grade: "poor", text: c => `Defer the upgrade until after launch to protect the timeline.`, fx: { support: { security: -15, compliance: -8 }, flag: "vulnOpen" }, out: c => `${c.s("security")} formally objects. Launch approval now depends on this fix.` },
      { grade: "ok", text: c => `Escalate to ${c.s("sponsor")} for a decision.`, fx: { support: { sponsor: -2 }, add: "K19", aware: "security" }, out: c => `${c.s("sponsor")} asks why you haven't assessed it with the team first, then approves the fix.` },
      { grade: "poor", text: c => `Ask the developers to patch it quietly without changing the sprint.`, fx: { vel: -0.08, team: -4 }, out: c => `The patch is rushed alongside the planned work; both suffer.` },
    ],
    lesson: c => `Impediments and issues are handled openly: log them, assess impact with the right experts, and reprioritise with the product owner. Security and compliance issues outrank new features.`,
    lens: `Issue questions reward assessing impact and acting through the agreed process. Deferring a known security or compliance problem is almost always wrong.` });

  def({ id: "A13", at: { sprint: 5, day: 6 }, title: "Weekend work for the launch", eco: ["People", 6], also: ["People", 3], principle: "servant",
    scene: c => [["sponsor", `We're close. Let's have the team work the next two weekends so we can launch with everything.`]],
    q: "What should you do?",
    options: [
      { grade: "poor", text: c => `Agree and tell the team the weekends are mandatory.`, fx: { overtime: 1, team: -10, debt: 0.05 }, out: c => `The team works the weekends. Defects rise, and ${c.s("commuter")} misses a family event.` },
      { grade: "best", text: c => `Explain the cost of an unsustainable pace using the team's data, and propose launching the must-have scope on time with ${c.s("po")} prioritising the rest for later.`, fx: { support: { sponsor: 2, po: 3 }, team: 4 }, out: c => `${c.s("sponsor")} accepts a launch of the must-have scope, with a published plan for what follows.` },
      { grade: "ok", text: c => `Ask for volunteers to work weekends.`, fx: { overtime: 1, team: -3 }, out: c => `Three people volunteer under quiet peer pressure.` },
      { grade: "poor", text: c => `Refuse without discussion; the team's welfare comes first.`, fx: { support: { sponsor: -10 } }, out: c => `${c.s("sponsor")} feels dismissed and starts going to the team directly.` },
    ],
    lesson: c => `Sustainable pace is an agile principle and a people-leadership duty. Manage stakeholder expectations with data and scope choices rather than burning out the team.`,
    lens: `Overtime is rarely the best answer. Look for options that use data and negotiate scope with the product owner and sponsor.` });

  def({ id: "A17", at: { sprint: 6, day: 4 }, title: "Done, or nearly done?", eco: ["Process", 7], principle: "process",
    scene: c => [["mo2", `The ledger screen works on my phone. Can we mark it done? Automated tests and the accessibility check can come next sprint. There is no next sprint, so I'd rather we just call it done.`]],
    q: "What should you do?",
    options: [
      { grade: "poor", text: c => `Agree; it works, and launch is close.`, fx: { debt: 0.08, escaped: 2 }, out: c => `The screen ships without tests. Two defects reach customers in the first week.` },
      { grade: "best", text: c => `Coach ${c.s("mo2")} that a story is only done when it meets the team's definition of done, and help the team find the fastest way to finish the tests.`, fx: { morale: { mo2: 2 }, dod: true }, out: c => `${c.s("qa")} pairs with ${c.s("mo2")}; the tests are done in a day and catch one real bug.` },
      { grade: "ok", text: c => `Ask ${c.s("po")} to decide whether to accept it.`, fx: {}, out: c => `${c.s("po")} rejects it because it doesn't meet the definition of done, so you lose a day.` },
      { grade: "poor", text: c => `Remove the tests from the definition of done for the final sprint.`, fx: { debt: 0.1, escaped: 3, team: -2 }, out: c => `Quality drops across the final sprint.` },
    ],

      if (a.prog >= 1) continue;
      if (a.start === null) {
        const ready = a.deps.every(d => get(S, d).prog >= 1) || (a.id === "J" && S.mods.fastTrack && get(S, "H").prog >= 0.6);
        if (!ready) continue;
        a.start = w;
      }
      if (S.mods.postingsFixAt && w >= S.mods.postingsFixAt) S.mods.postingsFixed = true;
      if (a.id === "M" && S.mods.postingsDelayed && !S.mods.postingsFixed) continue;
      let perf = a.owner === "Contractor" ? S.perfContractor : 0.97 + roll(S) * 0.08;
      if (a.rain) perf *= 1 - rain * (S.choices.rain === "mitigate" ? 0.12 : 0.38);
      if (a.boostWeeks > 0) { perf *= 1 + a.boost; a.boostWeeks--; }
      if (a.id === "J" && S.mods.fastTrack && get(S, "H").prog < 1) perf *= 0.85;
      if (a.id === "C" && S.mods.permitSlow) perf *= 0.6;
      if (a.id === "K" && S.mods.equipDelay) perf *= 0.7;
      perf *= 0.92 + roll(S) * 0.2;
      a.perf = perf;
      const inc = Math.min(1 - a.prog, perf / a.dur);
      a.prog += inc;
      // cost: 60% follows output, 40% follows time on site
      const rate = a.cost / a.dur;
      let spend = rate * (0.6 * inc * a.dur + 0.4 * 1) * a.cf;
      if (a.boostWeeks > 0) spend *= 1.25;
      a.ac += spend;
      if (a.prog >= 0.999) { a.prog = 1; a.end = w + 1; }
    }
    S.week++;
    const ev = S.acts.reduce((s, a) => s + a.prog * a.cost, 0);
    const ac = S.acts.reduce((s, a) => s + a.ac, 0) + (S.spentExtra || 0);
    S.ev.push(ev); S.ac.push(ac); S.pvHist.push(pvAt(S, S.week));
  }
  const pvAt = (S, w) => S.base.pv[Math.min(w, S.base.pv.length - 1)];
  function metrics(S) {
    const w = S.week, EV = S.ev[w], AC = S.ac[w], PV = pvAt(S, w);
    const CPI = AC ? EV / AC : 1, SPI = PV ? EV / PV : 1;
    // forecast the work actually on the plan (unapproved scope included), so EAC never falls below what is already spent
    const work = S.acts.reduce((t, x) => t + x.cost, 0);
    const EAC = Math.max(AC, work / Math.max(0.3, CPI));
    const c = cpm(S.acts, true);
    return { EV, AC, PV, CV: EV - AC, SV: EV - PV, CPI, SPI, EAC, ETC: EAC - AC, VAC: S.bac - EAC, TCPI: (S.bac - EV) / Math.max(1, S.bac - AC), finish: w + c.finish, critical: c.critical, float: c.float, ES: c.ES };
  }
  function runCycle(S, people) {
    for (let i = 0; i < CYCLE; i++) { weekStep(S, people); if (get(S, "N").prog >= 1) break; }
    S.cycle++;
    if (get(S, "N").prog >= 1) S.phase = "closure";
    // community mood drifts with communication choice
    if (S.choices.comms === "monthly") { S.stake.cda.support = clampN(S.stake.cda.support + 2, 0, 98); S.stake.baale.support = clampN(S.stake.baale.support + 1.5, 0, 98); }
    else S.stake.cda.support = clampN(S.stake.cda.support - 2, 0, 98);
    const m = metrics(S);
    S.stake.donor.support = clampN(S.stake.donor.support + (m.CPI > 0.95 && m.SPI > 0.95 ? 1.5 : m.CPI < 0.85 || m.SPI < 0.85 ? -2 : 0), 0, 98);
  }
  function crash(S, id) {
    const a = get(S, id); if (!a || a.prog >= 1 || a.start === null) return null;
    const cost = Math.round(a.cost * 0.12);
    a.boost = 0.35; a.boostWeeks = 6;
    const fromReserve = Math.min(cost, S.contingency - S.reserveUsed);
    S.reserveUsed += fromReserve;
    S.notes.push(`Week ${S.week}: crashed “${a.name}” with an extra crew (₦${cost}m${fromReserve < cost ? `, of which ₦${cost - fromReserve}m exceeds the contingency reserve` : " from the contingency reserve"}).`);
    a.cf *= 1 + cost / a.cost / 2;
    return cost;
  }
  function fastTrack(S) { if (S.mods.fastTrack) return false; S.mods.fastTrack = true; S.notes.push(`Week ${S.week}: fast-tracked finishes to overlap with electrical and plumbing. Expect some rework.`); get(S, "J").cf *= 1.06; S.defects += 1; return true; }

  def({ id: "C1", at: { cycle: 1 }, title: "The community wants a say", eco: ["People", 4], also: ["Business Environment", 2], principle: "ethics",
    scene: c => [["cda", `Good afternoon. Our young people want jobs on this site. And the association expects a development levy of five million naira before your machines come in. That is how things are done here.`], ["narr", `${c.n("baale")}, the community head, has not yet been formally consulted about the project.`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Pay the levy in cash from the contingency reserve to avoid delays.`, fx: { reserve: 5, audit: 1, support: { cda: 10, donor: -15 } }, out: c => `The site opens quietly, but the payment has no receipt or legal basis. The donor's auditors flag it months later.` },
      { grade: "best", text: c => `Pay a courtesy visit to ${c.s("baale")} with ${c.s("cda")}, explain the project and its benefits, agree local hiring through the contractor's normal recruitment, and explain that unofficial payments cannot be made.`, fx: { aware: "baale", support: { baale: 22, cda: 12, donor: 3 } }, out: c => `${c.s("baale")} welcomes the clinic and asks the youths to apply through the contractor. Twelve local workers are hired. The levy request is dropped.` },
      { grade: "poor", text: c => `Ask for police presence at the site gate.`, fx: { support: { cda: -20, baale: -10 }, delay: "E" }, out: c => `Relations sour. Work is disrupted for a week by protests.` },
      { grade: "ok", text: c => `Ask ${c.s("contractor")} to "handle the community" as part of the contract.`, fx: { support: { cda: -4 } }, out: c => `The contractor handles it in ways you can't see. You have transferred an ethical risk, not removed it.` },
    ],
    lesson: c => `Identify and engage stakeholders early, including traditional and community leaders. Benefits such as local jobs can be agreed openly, but unofficial payments breach law and the PMI Code of Ethics, whoever makes them.`,
    lens: `Ethics answers are never negotiable on the exam. Engage stakeholders openly; never pay or accept improper payments, even when "that's how things are done".` });

  def({ id: "C2", at: { cycle: 3 }, title: "A gift from a bidder", eco: ["Process", 5], also: ["Business Environment", 2], principle: "ethics",
    scene: c => [["bidder", `We are very keen on this contract. My driver will drop a small token of appreciation at your house this weekend. Nothing big. Just to say thank you for your time.`], ["narr", `Tender evaluation closes next week. ${c.contractorCo || "Three firms"} and two others have bid.`]],
    q: "What should you do?",
    options: [
      { grade: "ok", text: c => `Decline politely and say nothing more.`, fx: {}, out: c => `You stay clean, but the attempt is unrecorded and the bidder may try someone else on the panel.` },
      { grade: "best", text: c => `Decline, record the offer, report it under Bluegate's and the donor's procurement policy, and continue a fair evaluation against the published criteria.`, fx: { support: { donor: 6 } }, out: c => `The procurement committee notes the report and reviews the bidder's eligibility. The evaluation finishes on time and is defensible.` },
      { grade: "poor", text: c => `Accept the gift; it won't affect your scoring.`, fx: { audit: 1, support: { donor: -12 } }, out: c => `A competing bidder hears about the gift and files a complaint. The tender is challenged.`, delayD: true },
      { grade: "ok", text: c => `Disqualify the bidder immediately yourself.`, fx: { support: { donor: -2 } }, out: c => `You may be right, but you acted outside the procurement process. The disqualification is reviewed and upheld only after a delay.` },
    ],
    lesson: c => `Conflicts of interest and improper offers must be refused, recorded and reported through the organisation's policy. Procurement decisions follow published criteria and the agreed process.`,
    lens: `The PMI Code of Ethics expects you to report as well as refuse. "Decline quietly" is weaker than "decline and report".` });

  def({ id: "C3", at: { cycle: 5 }, title: "Better tiles, nobody asked", eco: ["Process", 2], principle: "process",
    scene: c => [["siteEng", `Good news: I've told the contractor to use porcelain tiles in all the wards instead of the ceramic ones in the specification. They're better quality, and the extra cost is only about four million naira.`]],
    q: "How should you respond?",
    options: [
      { grade: "poor", text: c => `Thank ${c.s("siteEng")}; better quality helps everyone.`, fx: { scopeCost: 4, audit: 1 }, out: c => `The tiles are installed. The donor's audit later questions an unapproved variation.` },
      { grade: "best", text: c => `Explain that the change is outside the approved scope, stop the instruction, and if the team believes it adds value, raise a change request with the impact for the change control board.`, fx: { morale: { siteEng: -3 } }, out: c => `${c.s("siteEng")} raises a change request. The board declines it: the budget is better spent on equipment.` },
      { grade: "ok", text: c => `Let it go this once, but ask ${c.s("siteEng")} to check with you in future.`, fx: { scopeCost: 4 }, out: c => `The cost is absorbed, and a precedent is set.` },
      { grade: "poor", text: c => `Ask the contractor to absorb the extra cost.`, fx: { support: { contractor: -10 } }, out: c => `The contractor refuses and files a claim for the instruction ${c.s("siteEng")} gave.` },
    ],
    lesson: c => `Adding work nobody asked for, known as gold plating, is still a scope change. Keep to the approved scope baseline and route any proposed change through change control, even when it seems to improve quality.`,
    lens: `Gold plating is a classic exam trap. The right answer protects the scope baseline and uses change control.` });

  def({ id: "C4", at: { cycle: 4 }, cond: S => rainLevel(S.week) > 0 || true, title: "The rains arrive", eco: ["Process", 8], also: ["Business Environment", 5], principle: "assess",
    scene: c => [["foreman", `The site has flooded twice this week. We can't pour the foundations until it dries out.`], ["narr", `Foundations and the frame are on the critical path.`]],
    dyn: true,
    q: "What should you do first?",
    options: [
      { grade: "best", text: c => `Analyse the delay against the critical path, compare options such as crashing, fast-tracking or using the contingency reserve under the risk response plan, and recommend a course of action to the sponsor.`, fx: { analysis: true, support: { donor: 3 } }, out: c => `Your analysis shows a delay to the end date unless the frame is crashed. With the risk response in the plan, ${c.s("donor")} approves an extra crew from the contingency reserve.`, crashF: true },
      { grade: "ok", text: c => `Instruct the contractor to work weekends to catch up.`, fx: { costAct: ["E", 0.05] }, out: c => `Weekend work helps a little, but you didn't check whether it was the best option or who pays for it.` },
      { grade: "poor", text: c => `Say nothing yet; the team may recover the time later.`, fx: { support: { donor: -8 } }, out: c => `The delay grows. The donor learns about it from a site visit.` },
      { grade: "poor", text: c => `Tell the contractor the delay is their problem and withhold the next payment.`, fx: { support: { contractor: -15 }, claim: 6 }, out: c => `Weather was an excusable delay under the contract. The contractor files a claim.` },
    ],
    lesson: c => `When a risk occurs, check the plan: is there a planned response and reserve? Analyse the impact on the critical path, evaluate options and recommend, rather than reacting or hiding it.`,
    lens: `"Analyse first" answers beat immediate action on the exam, unless safety is at stake.` });

  def({ id: "C5", at: { cycle: 5 }, title: "A failed concrete test", eco: ["Process", 7], principle: "process",
    scene: c => [["siteEng", `The 28-day cube results for the first-floor slab came back at 18 newtons per square millimetre. The specification is 25.`], ["foreman", `The slab looks fine. We can't stop now; the blockwork team is waiting.`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Continue work; cube tests are often wrong.`, fx: { defects: 3, support: { donor: -6 } }, out: c => `Cracks appear months later. The fix is far more expensive.` },
      { grade: "best", text: c => `Stop work on the affected area, follow the quality management plan (core tests and a structural engineer's review), and agree corrective action before continuing.`, fx: { delayAct: ["F", 1], defects: 0 }, out: c => `Core tests confirm a weak batch from one supplier. That section is strengthened, and the supplier pays for the remedy.` },
      { grade: "ok", text: c => `Retest the cubes before deciding anything.`, fx: { delayAct: ["F", 0.5] }, out: c => `The retest confirms the failure, a week later than the core tests would have.` },
      { grade: "poor", text: c => `Accept the slab with a discount from the contractor.`, fx: { defects: 2, audit: 1 }, out: c => `You've accepted a non-conforming slab in a public building.` },
    ],
    lesson: c => `Quality problems are handled through the quality plan: contain the problem, investigate the root cause and take corrective action. Prevention and early detection cost less than failure after handover.`,
    lens: `Quality answers favour following the quality management plan and root cause analysis over shortcuts or discounts.` });

  def({ id: "C6", at: { cycle: 6 }, title: "The naira falls", eco: ["Business Environment", 8], also: ["Process", 6], principle: "risk",
    dyn: true, scene: c => [], q: "What should you do first?", options: [],
    lesson: c => `External changes such as exchange-rate shocks are evaluated for impact and handled through the risk response plan, reserves and change control. Contract terms decide who carries the risk.`,

  def({ id: "C7", at: { cycle: 6 }, title: "Are we on track?", eco: ["Process", 9], also: ["People", 8], principle: "assess",
    dyn: true, scene: c => [], q: "", options: [],
    lesson: c => `Report status honestly with objective measures. Earned value shows both cost and schedule performance and forecasts the final cost, so sponsors can act early.`,

  def({ id: "C8", at: { cycle: 7 }, title: "A maternity wing", eco: ["Business Environment", 3], principle: "process",
    scene: c => [["donor", `Our board loves the progress. They'd like to add a small maternity wing. Funding is likely. Can you just add it?`]],
    q: "What should you do first?",
    options: [
      { grade: "poor", text: c => `Instruct the contractor to start the wing now so it's ready for the opening.`, fx: { addWing: "unfunded", audit: 1 }, out: c => `Work starts before the funding is approved. The budget overruns, and the auditors note an unapproved variation.` },
      { grade: "best", text: c => `Analyse the impact on scope, schedule, cost, quality and risk, then submit a formal change request to the change control board.`, fx: { addWing: "funded", support: { donor: 4 } }, out: c => `The board approves the wing with ₦60m of new funding and a re-baselined plan. The wing is built alongside the main works.` },
      { grade: "ok", text: c => `Ask ${c.s("donor")} to put the request in writing first.`, fx: {}, out: c => `A sensible step, but the request still needs an impact analysis and a change control decision.` },
      { grade: "poor", text: c => `Refuse; the scope baseline is fixed.`, fx: { support: { donor: -12 } }, out: c => `${c.s("donor")} is frustrated: changes are not forbidden, only controlled.` },

  def({ id: "C9", at: { cycle: 7 }, title: "No harnesses on the roof", eco: ["Business Environment", 2], principle: "ethics",
    scene: c => [["safety", `Four men are on the roof trusses without harnesses. The foreman says the harnesses slow them down and they're behind schedule.`]],
    q: "What should you do?",
    options: [
      { grade: "best", text: c => `Stop the unsafe work immediately, make sure safety equipment is used, then review the cause with ${c.s("contractor")} and ${c.s("safety")}.`, fx: { delayAct: ["G", 0.3], support: { contractor: -2 } }, out: c => `Work stops for two hours while harnesses are issued. ${c.s("contractor")} holds a safety briefing for all crews.` },
      { grade: "poor", text: c => `Raise it at next week's site meeting.`, fx: { incident: true }, out: c => `Three days later a labourer falls from the trusses and breaks his leg. Work stops for a week and the incident is reported to the authorities.` },
      { grade: "ok", text: c => `Write formally to the contractor about the breach.`, fx: {}, out: c => `The letter is filed, but the men stay on the roof without harnesses that afternoon.` },
      { grade: "poor", text: c => `Leave it; the workers are the contractor's employees.`, fx: { incident: true }, out: c => `A worker falls. Responsibility for site safety is shared, and the investigation names the project.` },
    ],
    lesson: c => `Safety is the exception to "analyse first": when people are in immediate danger, stop the work, then investigate. Health and safety compliance is non-negotiable.`,
    lens: `On the exam, immediate threats to safety are acted on first, before analysis or meetings.` });

  def({ id: "C10", at: { cycle: 8 }, title: "Nurses not yet posted", eco: ["Business Environment", 4], principle: "escalate",

  def({ id: "C11", at: { cycle: 8 }, title: "A rumour about the opening", eco: ["People", 8], principle: "people",

  def({ id: "C12", at: { phase: "closure" }, title: "An opening before handover", eco: ["Process", 10], principle: "process",
    scene: c => [["ministry", `The Commissioner wants to open the clinic on Saturday. The cameras are booked.`], ["siteEng", `We still have twenty-three items on the snag list, and the oxygen system hasn't been commissioned.`]],
    q: "What should you do?",

      { grade: "best", text: c => `Explain the acceptance criteria to ${c.s("ministry")}, offer a ceremonial event on Saturday, and hold formal handover once commissioning and the critical snags are complete and signed off.`, fx: { support: { ministry: -2, matron: 10, donor: 4 } }, out: c => `The Commissioner cuts the ribbon on Saturday. Formal handover follows nine days later with all critical items closed.` },
      { grade: "ok", text: c => `Postpone the ceremony until everything is finished.`, fx: { support: { ministry: -10 } }, out: c => `The ministry is embarrassed and blames the project.` },

    lesson: c => `Formal acceptance depends on the agreed acceptance criteria and sign-off by the people authorised to give it. Ceremonies and politics can be accommodated without accepting incomplete work.`,
    lens: `Closure answers: obtain formal acceptance against criteria, then close contracts, archive records and capture lessons learned.` });

  def({ id: "C13", at: { phase: "closure" }, title: "The contractor's final claim", eco: ["Process", 5], also: ["Process", 10], principle: "process",

  function dynamic(S, people, sit) {

        { grade: "ok", text: c => `Ask ${c.s("donor")} for more money straight away.`, fx: { fx: "reserve", support: { donor: -5 } }, out: c => `${c.s("donor")} asks why you haven't used the contingency set aside for this risk.` },
